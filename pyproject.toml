[tool.briefcase]
project_name = "Hype App"
bundle = "com.hype"
version = "1.0.0"
url = "https://github.com/hype"
license = "MIT"
license-files = ["LICENSE"]
author = "Hype"
author_email = "hype@example.com"

[tool.briefcase.app.hypeapp]
